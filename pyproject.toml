[project]
name = "edgecenter_mcp"
version = "1.0.0"
description = "MCP server for the EdgeCenter Cloud API: fleet inventory, pricing, consoles and power control"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["mcp>=2.0,<3", "httpx>=0.27"]

[project.urls]
Source = "https://github.com/Daloshka/edgecenter_mcp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # long lines live in tool descriptions, which read better unwrapped
